services:
  app:
    build: .
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    command: ["npx", "tsx", "src/worker.ts"]
    volumes:
      - ./data:/app/data
      # Script sources (docs/writing-a-source.md): the image does not contain these.
      # - ./sources.yaml:/app/sources.yaml:ro
      # - ./examples:/app/examples:ro
    depends_on:
      - app
    restart: unless-stopped
